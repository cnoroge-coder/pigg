# Render Deployment Configuration for Backend
# This file tells Render how to build and run your NestJS backend

# Build Command
build:
  npm install && npm run build && npm run prisma:generate

# Start Command  
start:
  npm run start:prod

# Environment
environment: node

# Healthcheck endpoint
healthCheckPath: /api/v1/health

# Auto-deploy
autoDeploy: true
