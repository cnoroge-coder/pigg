# Render Deployment Configuration for Backend

services:
  - type: web
    name: pig-farm-api
    env: node
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
