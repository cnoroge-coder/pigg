# Render Deployment Configuration for Backend

services:
  - type: web
    name: pig-farm-api
    env: node
    buildCommand: npm install --include=dev && npx prisma db push --accept-data-loss && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
