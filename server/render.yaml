# Render Deployment Configuration for Backend

services:
  - type: web
    name: pig-farm-api
    env: node
    buildCommand: npm install --include=dev && npm run build && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
