<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pig Farm — Add Litter</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <button class="back-btn" aria-label="Back" id="backBtn">←</button>
      <div class="brand"><span class="dot"></span> Pig Farm</div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="./">Dashboard</a>
        <a href="sows.html">Sows</a>
        <a href="boars.html">Boars</a>
        <a href="litters.html">Litters</a>
        <a href="feed.html">Feed</a>
        <a href="events.html">Events</a>
        <a href="health.html">Health</a>
        <a href="reports.html">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container small" style="padding:22px 0 40px">
    <div class="section-title"><h2>Add Litter</h2></div>
    
    <form id="litterForm" class="form-card">
      <div id="formMsg" class="form-msg"></div>
      
      <div class="form-row">
        <label for="motherName">Mother Name *</label>
        <select id="motherName" required>
          <option value="">-- Select Mother --</option>
        </select>
      </div>
      
      <div class="form-row">
        <label for="fatherName">Father Name (Optional)</label>
        <select id="fatherName">
          <option value="">-- Optional --</option>
        </select>
      </div>
      
      <div class="form-row">
        <label for="farrowDate">Farrow Date *</label>
        <input type="date" id="farrowDate" required />
      </div>
      
      <div class="form-row">
        <label for="numberBorn">Number Born *</label>
        <input type="number" id="numberBorn" min="0" required />
      </div>
      
      <div class="form-row">
        <label for="alive">Alive *</label>
        <input type="number" id="alive" min="0" required />
      </div>
      
      <div class="form-row">
        <label for="dead">Dead</label>
        <input type="number" id="dead" min="0" value="0" />
      </div>
      
      <div class="form-row">
        <label for="weaningDate">Weaning Date</label>
        <input type="date" id="weaningDate" />
      </div>
      
      <div class="form-row">
        <label for="weaningWeight">Weaning Weight (kg)</label>
        <input type="number" id="weaningWeight" step="0.1" min="0" />
      </div>
      
      <div class="form-row">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="4"></textarea>
      </div>
      
      <div class="form-actions">
        <button type="submit" id="saveBtn" class="btn">Save Litter</button>
        <button type="reset" class="btn-outline">Reset</button>
      </div>
    </form>
  </main>

  <footer class="footer">
    <div class="container small">© <span id="year"></span> Pig Farm Management</div>
  </footer>

  <script src="assets/supa-config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/api-loader.js"></script>
  <script src="assets/modules.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/litter-form.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
