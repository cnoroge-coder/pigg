<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pig Farm — Litters</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <header class="header">
    <div class="container nav">
  <button class="back-btn" aria-label="Back" id="backBtn">←</button>
  <div class="brand"><span class="dot"></span> Pig Farm</div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="./">Dashboard</a>
        <a href="sows.html">Sows</a>
        <a href="boars.html">Boars</a>
        <a href="litters.html">Litters</a>
        <a href="piglets.html">Piglets</a>
  <a href="feed.html">Feed</a>
  <a href="events.html">Events</a>
  <a href="health.html">Health</a>
        <a href="reports.html">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:22px 0 40px">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
      <h2>Litters</h2>
      <div style="display:flex;gap:8px">
        <button id="addLitterEventBtn" class="btn" style="background:#8b5cf6;border-color:#7c3aed;color:#fff">Add Event to Litters</button>
        <a href="add-litter.html" class="btn" style="text-decoration:none">+ Add Litter</a>
      </div>
    </div>
    <div class="tr head">
      <div>Select</div><div>Sow</div><div>Live born</div><div>Dead</div><div>Status</div>
    </div>
    <div id="litters" class="grid" style="gap:10px"></div>

    <div style="height:24px"></div>
    <!-- Breeding/serving records intentionally removed from this page. Click a litter to view its piglet monitoring (4m / 3w) -->
    <div id="litterDetails" style="margin-top:18px"></div>

  <!-- Piglet monitoring moved to individual sow/pig detail pages -->
  </main>

  <footer class="footer">
    <div class="container small">© <span id="year"></span> Pig Farm Management</div>
  </footer>

  <script src="assets/supa-config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/api-loader.js"></script>
  <script src="assets/modules.js"></script>
  <script src="assets/app.js"></script>
  <script>
  // showLitterDetails: navigate to dedicated litter page or render inline fallback
  function showLitterDetails(l){
    try{
      if(l && l.id){
        // prefer dedicated page for full details
        window.location.href = `litter.html?id=${encodeURIComponent(l.id)}`;
        return;
      }
    }catch(e){ /* ignore and fallback to inline */ }
    const container = document.getElementById('litterDetails');
    if(!container) return;
    if(!l) { container.innerHTML = '<div class="card small">No litter selected</div>'; return; }
    container.innerHTML = `
      <div class="card">
        <div class="small">Sow</div>
        <div style="font-weight:700">${l.sowTag||'Unknown'}</div>
        <div class="small">Born</div>
        <div>${l.bornDate||''}</div>
        <div class="small">Piglets</div>
        <div>${(l.piglets||[]).length}</div>
      </div>
    `;
  }

  function daysBetween(dateStr){ if(!dateStr) return null; const d=new Date(dateStr); const now=new Date(); return Math.floor((now - d)/(1000*60*60*24)); }

  

  let selectedLitters = new Set();
  let eventSelectionMode = false;

  function renderLitters(){
    const root = document.getElementById('litters'); 
    if (!root) return;
    
    root.innerHTML='';
    const LITTERS = window.Modules?.AnimalsModule?.litters || [];
    
    console.log('Rendering litters:', LITTERS.length);
    console.log('Litters data:', LITTERS);
    console.log('Full Modules object:', window.Modules);
    
    if (LITTERS.length === 0) {
      root.innerHTML = '<div class="card small">No litters recorded yet. <a href="add-litter.html">Add a litter</a></div>';
      return;
    }
    
    LITTERS.forEach(l=>{
      const row = document.createElement('div'); row.className='tr';
      
      // Get sow name from pregnancy data
      const sowName = l.pregnancy?.sow?.name || l.pregnancy?.sow?.tagNo || 'Unknown';
      const farrowDate = l.farrowDate ? new Date(l.farrowDate).toLocaleDateString() : 'N/A';
      
      if (eventSelectionMode) {
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = selectedLitters.has(l.id);
        checkbox.addEventListener('change', (e) => {
          e.stopPropagation();
          if (checkbox.checked) {
            selectedLitters.add(l.id);
          } else {
            selectedLitters.delete(l.id);
          }
        });
        
        row.innerHTML = `
          <div></div>
          <div>${sowName}</div>
          <div class="kpi"><span class="dot" style="background:#22c55e"></span> ${l.alive || 0}</div>
          <div class="kpi"><span class="dot" style="background:#ef4444"></span> ${l.dead || 0}</div>
          <div><span class="badge">${farrowDate}</span></div>
        `;
        row.firstElementChild.appendChild(checkbox);
      } else {
        row.style.cursor = 'pointer';
        row.innerHTML = `
          <div></div>
          <div>${sowName}</div>
          <div class="kpi"><span class="dot" style="background:#22c55e"></span> ${l.alive || 0}</div>
          <div class="kpi"><span class="dot" style="background:#ef4444"></span> ${l.dead || 0}</div>
          <div><span class="badge">${farrowDate}</span></div>
        `;
        row.addEventListener('click', ()=> showLitterDetails(l));
      }
      root.append(row);
    })
  }

  // Add litter event button
  document.getElementById('addLitterEventBtn').addEventListener('click', () => {
    eventSelectionMode = !eventSelectionMode;
    
    if (eventSelectionMode) {
      document.getElementById('addLitterEventBtn').textContent = 'Done Selecting';
      document.getElementById('addLitterEventBtn').style.background = '#22c55e';
      selectedLitters.clear();
      renderLitters();
    } else {
      if (selectedLitters.size > 0) {
        showLitterEventModal();
      }
      document.getElementById('addLitterEventBtn').textContent = 'Add Event to Litters';
      document.getElementById('addLitterEventBtn').style.background = '#8b5cf6';
      eventSelectionMode = false;
      renderLitters();
    }
  });

  function showLitterEventModal() {
    const modal = document.createElement('div');
    modal.id = 'litterEventModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000';
    
    modal.innerHTML = `
      <div style="background:white;padding:24px;border-radius:8px;max-width:400px;width:90%">
        <h3 style="margin-top:0">Add Event to ${selectedLitters.size} Litter(s)</h3>
        <label style="display:block;margin-top:16px;font-weight:600">Event Type</label>
        <select id="litterEventType" style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px">
          <option value="Vaccination">Vaccination</option>
          <option value="Health Check">Health Check</option>
          <option value="Treatment">Treatment</option>
          <option value="Weaning">Weaning</option>
          <option value="Other">Other</option>
        </select>
        <div id="customLitterEventTypeArea" style="display:none;margin-top:8px">
          <label style="display:block;font-weight:600">Custom Event Type</label>
          <input type="text" id="customLitterEventType" placeholder="Enter event type..." style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px" />
        </div>
        <label style="display:block;margin-top:12px;font-weight:600">Date</label>
        <input type="date" id="litterEventDate" style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px" />
        <label style="display:block;margin-top:12px;font-weight:600">Notes</label>
        <textarea id="litterEventNotes" rows="3" style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px"></textarea>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" id="saveLitterEvent">Save</button>
          <button class="btn" id="cancelLitterEvent">Cancel</button>
        </div>
      </div>
    `;
    
    document.body.appendChild(modal);
    document.getElementById('litterEventDate').valueAsDate = new Date();
    
    // Handle Other event type
    document.getElementById('litterEventType').addEventListener('change', (e) => {
      const customArea = document.getElementById('customLitterEventTypeArea');
      if (e.target.value === 'Other') {
        customArea.style.display = 'block';
      } else {
        customArea.style.display = 'none';
        document.getElementById('customLitterEventType').value = '';
      }
    });

    document.getElementById('cancelLitterEvent').addEventListener('click', () => {
      modal.remove();
    });

    document.getElementById('saveLitterEvent').addEventListener('click', async () => {
      const API_BASE_URL = window.API_BASE_URL || 'https://pig-3k5m.onrender.com/api/v1';
      
      let eventType = document.getElementById('litterEventType').value;
      
      if (eventType === 'Other') {
        const customType = document.getElementById('customLitterEventType').value.trim();
        if (!customType) {
          alert('Please enter a custom event type');
          return;
        }
        eventType = customType;
      }
      
      const eventData = {
        type: eventType,
        date: document.getElementById('litterEventDate').value,
        notes: document.getElementById('litterEventNotes').value || null,
        litterIds: Array.from(selectedLitters)
      };

      try {
        const response = await fetch(`${API_BASE_URL}/events`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(eventData)
        });

        if (response.ok) {
          alert(`Event added successfully for ${selectedLitters.size} litter(s)!`);
          modal.remove();
          selectedLitters.clear();
        } else {
          alert('Failed to add event');
        }
      } catch (error) {
        console.error('Error adding event:', error);
        alert('Error adding event');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    // Wait for animals (and litters) to load before rendering
    window.addEventListener('animalsLoaded', () => {
      console.log('Animals loaded, rendering litters...');
      renderLitters();
    });
    
    // Try immediate render if data already available
    if (window.Modules?.AnimalsModule?.litters) {
      renderLitters();
    }
    
    wireActiveNav(); document.getElementById('year').textContent = new Date().getFullYear();
    wireActiveNav(); document.getElementById('year').textContent = new Date().getFullYear();
  });
  </script>
</body>
</html>
