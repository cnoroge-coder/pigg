<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pig Farm — Dashboard</title>
  <!-- Build: 2025-12-19-v2 -->
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <header class="header">
    <div class="container nav">
  <button class="back-btn" aria-label="Back" id="backBtn">←</button>
  <div class="brand"><span class="dot"></span> Pig Farm</div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <nav class="nav-links">
  <a href="./">Dashboard</a>
  <a href="sows.html">Sows</a>
  <a href="boars.html">Boars</a>
        <a href="litters.html">Litters</a>
        <a href="piglets.html">Piglets</a>
  <a href="feed.html">Feed</a>
  <a href="events.html">Events</a>
  <a href="health.html">Health</a>
        <a href="reports.html">Reports</a>
        <a href="add-pig.html">Add Pig</a>
      </nav>
      <button id="themeToggle" class="btn" style="margin-left:8px">Toggle Theme</button>
    </div>
  </header>

  <main class="container" style="padding:22px 0 40px">
    <section class="hero card">
      <img src="/pics/Pig.jpeg" alt="farm"/>
      <div class="overlay">
        <div>
          <h1>Command Center</h1>
          <p class="small">Key metrics, alerts and trends at a glance</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>Key Metrics</h2>
        <span class="badge ok"><span class="dot" style="background:#22c55e"></span> Healthy</span>
      </div>
      <div id="tiles" class="grid tiles"></div>
    </section>

    <section class="section">
      <div class="section-title"><h2>Alerts</h2></div>
      <div id="alerts" class="list" style="max-height:400px;overflow-y:auto"></div>
    </section>

    <section class="section">
      <div class="section-title"><h2>Missed Events</h2></div>
      <div id="missedEvents" class="list" style="max-height:400px;overflow-y:auto"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container small">© <span id="year"></span> Pig Farm Management</div>
  </footer>

  <!-- Environment variables (injected by Vercel build) -->
  <script src="assets/env.js"></script>
  <!-- Supabase config (optional) and client bootstrap. Edit supa-config.js to set your project URL and anon key for local testing. -->
  <script src="assets/supa-config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/modules.js"></script>
  <script src="assets/api-loader.js"></script>
  <script src="assets/app.js"></script>
  <script>
  // Wait for API data to load before rendering
  window.addEventListener('animalsLoaded', async (e) => {
    const { AnimalsModule } = window.Modules;
    const API_BASE_URL = window.API_BASE_URL || 'https://pig-3k5m.onrender.com/api/v1';
    
    // Separate piglets by gender
    const piglets = Array.isArray(AnimalsModule.piglets) ? AnimalsModule.piglets : [];
    const malePiglets = piglets.filter(p => p.gender && p.gender.toLowerCase().startsWith('m'));
    const femalePiglets = piglets.filter(p => p.gender && p.gender.toLowerCase().startsWith('f'));
    const unknownPiglets = piglets.filter(p => !p.gender || (!p.gender.toLowerCase().startsWith('m') && !p.gender.toLowerCase().startsWith('f')));
    
    // Calculate litters (placeholder - will need actual litter data)
    const totalLitters = 0; // TODO: Get from LittersModule when implemented
    const nursingLitters = 0; // TODO: Get from LittersModule when implemented
    
    const totalPigs = AnimalsModule.sows.length + AnimalsModule.boars.length + piglets.length;
    
    // Populate Key Metrics tiles
    const tiles = document.getElementById('tiles');
    tiles.innerHTML = '';
    
    const metrics = [
      {label:'Total Animals', value:totalPigs, link: null},
      {label:'Sows', value:AnimalsModule.sows.length, link: 'sows.html'},
      {label:'Boars', value:AnimalsModule.boars.length, link: 'boars.html'},
      {label:'Total Piglets', value:piglets.length, link: 'piglets.html'},
      {label:'Male Piglets', value:malePiglets.length + unknownPiglets.length, link: 'piglets.html'},
      {label:'Female Piglets', value:femalePiglets.length, link: 'piglets.html'},
      {label:'Total Litters', value:totalLitters, link: 'litters.html'},
      {label:'Nursing Litters', value:nursingLitters, link: 'litters.html'}
    ];
    
    metrics.forEach(m => {
      const c = document.createElement(m.link ? 'a' : 'div');
      c.className = 'card pad tile';
      if(m.link) {
        c.href = m.link;
        c.style.cursor = 'pointer';
      }
      c.innerHTML = `<div class="label">${m.label}</div><div class="value">${m.value}</div>`;
      tiles.append(c);
    });

    // Load and display mature piglets alerts
    try {
      const response = await fetch(`${API_BASE_URL}/piglets`);
      const allPiglets = await response.json();
      const today = new Date();
      
      const alertsDiv = document.getElementById('alerts');
      alertsDiv.innerHTML = '';
      
      // Check for mature piglets
      const maturePiglets = allPiglets.filter(p => {
        if (p.maturityWeeks && p.maturitySetDate) {
          const setDate = new Date(p.maturitySetDate);
          const weeksPassed = Math.floor((today - setDate) / (7 * 24 * 60 * 60 * 1000));
          return weeksPassed >= p.maturityWeeks;
        }
        return false;
      });

      if (maturePiglets.length > 0) {
        maturePiglets.forEach(p => {
          const alert = document.createElement('div');
          alert.className = 'card pad';
          alert.style.borderLeft = '4px solid #22c55e';
          alert.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-weight:700">🎯 Piglet Maturity Reached</div>
                <div class="small">Piglet ${p.tagNo || p.name || p.id} has reached maturity target</div>
              </div>
              <a href="piglet.html?id=${p.id}" class="btn">View</a>
            </div>
          `;
          alertsDiv.appendChild(alert);
        });
      }

      if (alertsDiv.innerHTML === '') {
        alertsDiv.innerHTML = '<div class="card pad small" style="color:#a1a1aa">No alerts at this time</div>';
      }
    } catch (error) {
      console.error('Error loading alerts:', error);
    }

    // Load and display missed events
    try {
      const eventsResponse = await fetch(`${API_BASE_URL}/events`);
      const allEvents = await eventsResponse.json();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const missedEventsDiv = document.getElementById('missedEvents');
      missedEventsDiv.innerHTML = '';

      const missedEvents = allEvents.filter(e => {
        const eventDate = new Date(e.date);
        eventDate.setHours(0, 0, 0, 0);
        return eventDate < today && !e.resolved;
      });

      if (missedEvents.length > 0) {
        missedEvents.forEach(e => {
          const eventDate = new Date(e.date);
          const daysOverdue = Math.floor((today - eventDate) / (24 * 60 * 60 * 1000));
          
          const alert = document.createElement('div');
          alert.className = 'card pad';
          alert.style.borderLeft = '4px solid #ef4444';
          alert.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-weight:700">⚠️ Missed Event: ${e.type}</div>
                <div class="small">${daysOverdue} day(s) overdue - ${e.date}</div>
                ${e.notes ? `<div class="small" style="margin-top:4px">${e.notes}</div>` : ''}
              </div>
              <a href="events.html" class="btn">Resolve</a>
            </div>
          `;
          missedEventsDiv.appendChild(alert);
        });
      } else {
        missedEventsDiv.innerHTML = '<div class="card pad small" style="color:#a1a1aa">No missed events</div>';
      }
    } catch (error) {
      console.error('Error loading missed events:', error);
      document.getElementById('missedEvents').innerHTML = '<div class="card pad small" style="color:#a1a1aa">Unable to load events</div>';
    }
  });
  
  document.getElementById('year').textContent = new Date().getFullYear();
  wireActiveNav();
  </script>
</body>
</html>
