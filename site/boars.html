<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pig Farm — Boars</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <header class="header">
    <div class="container nav">
  <button class="back-btn" aria-label="Back" id="backBtn">←</button>
  <div class="brand"><span class="dot"></span> Pig Farm</div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="./">Dashboard</a>
        <a href="sows.html">Sows</a>
        <a href="boars.html">Boars</a>
        <a href="litters.html">Litters</a>
        <a href="piglets.html">Piglets</a>
  <a href="feed.html">Feed</a>
  <a href="events.html">Events</a>
  <a href="health.html">Health</a>
        <a href="reports.html">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:22px 0 40px">
    <div class="section-title">
      <h2>Boars</h2>
      <div style="display:flex;gap:8px">
        <button class="btn" id="addBoarEventBtn" style="background:#8b5cf6;border-color:#7c3aed;color:#fff">Add Event to Boars</button>
        <a class="btn" href="add-pig.html">Add Pig</a>
      </div>
    </div>

    <div id="boarList" class="list"></div>
  </main>

  <footer class="footer">
    <div class="container small">© <span id="year"></span> Pig Farm Management</div>
  </footer>

  <script src="assets/supa-config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/modules.js"></script>
  <script src="assets/api-loader.js"></script>
  <script src="assets/app.js"></script>
  <script>
  let selectedBoars = new Set();
  let boarEventSelectionMode = false;

  function renderBoars(){
    const root = document.getElementById('boarList'); root.innerHTML='';
    const mod = window.Modules.AnimalsModule;
    mod.boars.forEach(b=>{
      const it=document.createElement('a'); 
      it.className='item boar-item'; 
      it.setAttribute('data-tag', b.tagNo);
      
      if (boarEventSelectionMode) {
        it.href = 'javascript:void(0)';
        it.style.position = 'relative';
        it.addEventListener('click', (e) => {
          e.preventDefault();
          if (selectedBoars.has(b.tagNo)) {
            selectedBoars.delete(b.tagNo);
            it.style.border = '1px solid #e5e7eb';
          } else {
            selectedBoars.add(b.tagNo);
            it.style.border = '2px solid #8b5cf6';
          }
        });
      } else {
        it.href='pig.html?tag='+encodeURIComponent(b.tagNo);
      }
      
      it.innerHTML = `
  <img src="${b.imageUrl || b.image || b.image_url || '/pics/Pig.jpeg'}" alt="pig" style="width:56px;height:56px;border-radius:8px;object-fit:cover;margin-right:12px" />
        <div style="flex:1">
          <div style="font-weight:700">${b.name} <span class="small" style="margin-left:6px;color:#bbb">(${b.breed})</span></div>
          <div class="small">Use count: <strong>${b.uses}</strong> • Fertility: <strong>${Math.round(b.fertility*100)}%</strong></div>
          <div class="small" id="boar_upcoming_${b.tagNo}" style="margin-top:6px"></div>
        </div>
        <span class="badge ${b.fertility>0.75?'ok':b.fertility>0.6?'warn':'danger'}">Fertility</span>
      `;
      root.append(it);
    })
    // populate upcoming events for boars
    setTimeout(()=>{
      const today = new Date(); today.setHours(0,0,0,0);
      mod.boars.forEach(b=>{
        const evs = (window.Modules.EventsModule.getFor(b.tagNo)||[]).filter(e=> new Date(e.date).setHours(0,0,0,0) >= today).sort((a,b2)=> new Date(a.date)-new Date(b2.date));
        const next = evs[0];
        const el = document.getElementById('boar_upcoming_'+b.tagNo);
        if(next) el.innerHTML = `<strong>Upcoming:</strong> ${next.type} • <span class="small">${next.date}</span>`; else el.innerHTML = `<span class="small">No upcoming events</span>`;
      });
    },60);
  }

  // Add boar event button handler
  document.getElementById('addBoarEventBtn').addEventListener('click', () => {
    boarEventSelectionMode = !boarEventSelectionMode;
    
    if (boarEventSelectionMode) {
      document.getElementById('addBoarEventBtn').textContent = 'Done Selecting';
      document.getElementById('addBoarEventBtn').style.background = '#22c55e';
      selectedBoars.clear();
      renderBoars();
    } else {
      if (selectedBoars.size > 0) {
        showBoarEventModal();
      }
      document.getElementById('addBoarEventBtn').textContent = 'Add Event to Boars';
      document.getElementById('addBoarEventBtn').style.background = '#8b5cf6';
      boarEventSelectionMode = false;
      renderBoars();
    }
  });

  function showBoarEventModal() {
    const modal = document.createElement('div');
    modal.id = 'boarEventModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000';
    
    modal.innerHTML = `
      <div style="background:white;padding:24px;border-radius:8px;max-width:400px;width:90%">
        <h3 style="margin-top:0">Add Event to ${selectedBoars.size} Boar(s)</h3>
        <label style="display:block;margin-top:16px;font-weight:600">Event Type</label>
        <select id="boarEventType" style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px">
          <option value="Vaccination">Vaccination</option>
          <option value="Health Check">Health Check</option>
          <option value="Treatment">Treatment</option>
          <option value="Breeding">Breeding</option>
          <option value="Other">Other</option>
        </select>
        <div id="customBoarEventTypeArea" style="display:none;margin-top:8px">
          <label style="display:block;font-weight:600">Custom Event Type</label>
          <input type="text" id="customBoarEventType" placeholder="Enter event type..." style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px" />
        </div>
        <label style="display:block;margin-top:12px;font-weight:600">Date</label>
        <input type="date" id="boarEventDate" style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px" />
        <label style="display:block;margin-top:12px;font-weight:600">Notes</label>
        <textarea id="boarEventNotes" rows="3" style="width:100%;padding:8px;margin:8px 0;border:1px solid #d1d5db;border-radius:4px"></textarea>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" id="saveBoarEvent">Save</button>
          <button class="btn" id="cancelBoarEvent">Cancel</button>
        </div>
      </div>
    `;
    
    document.body.appendChild(modal);
    document.getElementById('boarEventDate').valueAsDate = new Date();
    
    // Handle Other event type
    document.getElementById('boarEventType').addEventListener('change', (e) => {
      const customArea = document.getElementById('customBoarEventTypeArea');
      if (e.target.value === 'Other') {
        customArea.style.display = 'block';
      } else {
        customArea.style.display = 'none';
        document.getElementById('customBoarEventType').value = '';
      }
    });

    document.getElementById('cancelBoarEvent').addEventListener('click', () => {
      modal.remove();
    });

    document.getElementById('saveBoarEvent').addEventListener('click', async () => {
      const API_BASE_URL = window.API_BASE_URL || 'https://pig-3k5m.onrender.com/api/v1';
      
      let eventType = document.getElementById('boarEventType').value;
      
      if (eventType === 'Other') {
        const customType = document.getElementById('customBoarEventType').value.trim();
        if (!customType) {
          alert('Please enter a custom event type');
          return;
        }
        eventType = customType;
      }
      
      const eventData = {
        type: eventType,
        date: document.getElementById('boarEventDate').value,
        notes: document.getElementById('boarEventNotes').value || null,
        boarTags: Array.from(selectedBoars)
      };

      try {
        const response = await fetch(`${API_BASE_URL}/events`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(eventData)
        });

        if (response.ok) {
          alert(`Event added successfully for ${selectedBoars.size} boar(s)!`);
          modal.remove();
          selectedBoars.clear();
        } else {
          alert('Failed to add event');
        }
      } catch (error) {
        console.error('Error adding event:', error);
        alert('Error adding event');
      }
    });
  }

  window.addEventListener('animalsLoaded', renderBoars);
  wireActiveNav(); document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
