<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pig Farm — Events</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <button class="back-btn" aria-label="Back" id="backBtn">←</button>
      <div class="brand"><span class="dot"></span> Pig Farm</div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="./">Dashboard</a>
        <a href="sows.html">Sows</a>
        <a href="boars.html">Boars</a>
        <a href="litters.html">Litters</a>
        <a href="piglets.html">Piglets</a>
        <a href="feed.html">Feed</a>
        <a href="events.html">Events</a>
        <a href="health.html">Health</a>
        <a href="reports.html">Reports</a>
        <a href="add-pig.html">Add Pig</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:22px 0 40px">
    <div class="section-title" style="align-items:center">
      <h2 id="eventsTitle">All Events</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="filterUpcoming" class="btn active">Upcoming</button>
        <button id="filterPast" class="btn">Past</button>
        <button id="filterAll" class="btn">All</button>
        <button id="addEventBtn" class="btn" style="margin-left:12px;background:#22c55e;border-color:#16a34a;color:#fff">+ Add Event</button>
      </div>
    </div>
    
    <div id="eventsSummary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0"></div>
    
    <div id="eventsGrid" class="list"></div>
  </main>

  <!-- Add Event Modal -->
  <div id="addEventModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Add Event</h3>
      <form id="addEventForm">
        <label>Event Type *</label>
        <select id="eventType" required>
          <option value="">Select type...</option>
          <option value="Vaccination">Vaccination</option>
          <option value="Health Check">Health Check</option>
          <option value="Treatment">Treatment</option>
          <option value="Weaning">Weaning</option>
          <option value="Weight Check">Weight Check</option>
          <option value="Breeding">Breeding</option>
          <option value="Other">Other</option>
        </select>
        
        <div id="customEventTypeArea" style="display:none;margin-top:8px">
          <label>Custom Event Type *</label>
          <input type="text" id="customEventType" placeholder="Enter event type..." style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:4px" />
        </div>
        
        <label>Apply To *</label>
        <select id="eventTarget" required>
          <option value="piglet">Individual Piglet</option>
          <option value="litter">Entire Litter</option>
          <option value="sow">Sow</option>
          <option value="boar">Boar</option>
          <option value="multiple">Multiple Piglets</option>
        </select>
        
        <div id="targetSelectionArea"></div>
        
        <label>Date *</label>
        <input type="date" id="eventDate" required />
        
        <label>Notes</label>
        <textarea id="eventNotes" rows="3"></textarea>
        
        <div style="display:flex;gap:8px;margin-top:16px">
          <button type="submit" class="btn">Save Event</button>
          <button type="button" class="btn" id="cancelEventBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container small">© <span id="year"></span> Pig Farm Management</div>
  </footer>

  <script src="assets/supa-config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/api-loader.js"></script>
  <script src="assets/modules.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const API_BASE_URL = window.API_BASE_URL || 'https://pig-3k5m.onrender.com/api/v1';
    let allEvents = [];
    let allPiglets = [];
    let allLitters = [];
    let currentFilter = 'upcoming';

    async function loadEvents() {
      try {
        // Load events from API when endpoint is ready
        // For now, use empty array - events will be in database
        allEvents = [];
        renderEvents();
      } catch (error) {
        console.error('Error loading events:', error);
      }
    }

    async function loadPiglets() {
      try {
        const response = await fetch(`${API_BASE_URL}/piglets`);
        if (response.ok) {
          allPiglets = await response.json();
        }
      } catch (error) {
        console.error('Error loading piglets:', error);
      }
    }

    async function loadLitters() {
      try {
        const response = await fetch(`${API_BASE_URL}/litters`);
        if (response.ok) {
          allLitters = await response.json();
        }
      } catch (error) {
        console.error('Error loading litters:', error);
      }
    }

    function renderEvents() {
      const grid = document.getElementById('eventsGrid');
      const summary = document.getElementById('eventsSummary');
      
      grid.innerHTML = '';
      summary.innerHTML = '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let filtered = allEvents;
      if (currentFilter === 'upcoming') {
        filtered = allEvents.filter(e => new Date(e.date) >= today);
      } else if (currentFilter === 'past') {
        filtered = allEvents.filter(e => new Date(e.date) < today);
      }

      // Sort by date
      filtered.sort((a, b) => {
        if (currentFilter === 'past') {
          return new Date(b.date) - new Date(a.date); // Newest first for past
        }
        return new Date(a.date) - new Date(b.date); // Soonest first for upcoming
      });

      // Summary cards
      const upcoming = allEvents.filter(e => new Date(e.date) >= today).length;
      const past = allEvents.filter(e => new Date(e.date) < today).length;
      
      summary.innerHTML = `
        <div class="card pad">
          <div class="small">Total Events</div>
          <div style="font-size:28px;font-weight:700">${allEvents.length}</div>
        </div>
        <div class="card pad">
          <div class="small">Upcoming</div>
          <div style="font-size:28px;font-weight:700;color:#22c55e">${upcoming}</div>
        </div>
        <div class="card pad">
          <div class="small">Past</div>
          <div style="font-size:28px;font-weight:700;color:#6b7280">${past}</div>
        </div>
      `;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="card pad small">No events found. Click "+ Add Event" to create one.</div>';
        return;
      }

      filtered.forEach(event => {
        const card = document.createElement('div');
        card.className = 'card pad';
        
        const isPast = new Date(event.date) < today;
        const dateColor = isPast ? '#6b7280' : '#22c55e';
        
        // Determine targets display
        let targetsDisplay = '';
        if (event.pigletIds && event.pigletIds.length > 0) {
          targetsDisplay = `${event.pigletIds.length} piglet(s)`;
        } else if (event.litterId) {
          targetsDisplay = 'Entire litter';
        } else if (event.sowId || event.boarId) {
          targetsDisplay = event.sowId ? 'Sow' : 'Boar';
        }

        const isOverdue = isPast && !event.resolved;
        let statusBadge = '';
        if (event.resolved) {
          statusBadge = '<span class="badge ok" style="background:#22c55e">Resolved</span>';
        } else if (isOverdue) {
          statusBadge = '<span class="badge danger" style="background:#ef4444">Overdue</span>';
        } else {
          statusBadge = '<span class="badge" style="background:#3b82f6">Scheduled</span>';
        }

        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div>
              <div style="font-weight:700;font-size:18px">${event.type}</div>
              <div class="small" style="color:#6b7280;margin-top:4px">${targetsDisplay}</div>
            </div>
            <div style="text-align:right">
              <div style="color:${dateColor};font-weight:600">${new Date(event.date).toLocaleDateString()}</div>
              <div style="margin-top:4px">${statusBadge}</div>
            </div>
          </div>
          ${event.notes ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e5e7eb;color:#6b7280">${event.notes}</div>` : ''}
          <div style="display:flex;gap:8px;margin-top:12px">
            ${!event.resolved && isPast ? `<button class="btn" style="flex:1;background:#22c55e;border-color:#16a34a;color:#fff" onclick="resolveEvent('${event.id}')">Mark as Resolved</button>` : ''}
            <button class="btn" style="flex:1;background:#ef4444;border-color:#dc2626;color:#fff" onclick="deleteEvent('${event.id}')">Delete</button>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    async function resolveEvent(eventId) {
      try {
        const response = await fetch(`${API_BASE_URL}/events/${eventId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resolved: true })
        });

        if (response.ok) {
          alert('Event marked as resolved!');
          await loadEvents();
        } else {
          alert('Failed to resolve event');
        }
      } catch (error) {
        console.error('Error resolving event:', error);
        alert('Error resolving event');
      }
    }

    async function deleteEvent(eventId) {
      if (!confirm('Are you sure you want to delete this event?')) return;
      
      try {
        const response = await fetch(`${API_BASE_URL}/events/${eventId}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          alert('Event deleted successfully!');
          await loadEvents();
        } else {
          alert('Failed to delete event');
        }
      } catch (error) {
        console.error('Error deleting event:', error);
        alert('Error deleting event');
      }
    }

    // Modal handling
    document.getElementById('addEventBtn').addEventListener('click', () => {
      document.getElementById('addEventModal').style.display = 'flex';
      document.getElementById('eventDate').valueAsDate = new Date();
    });

    document.getElementById('cancelEventBtn').addEventListener('click', () => {
      document.getElementById('addEventModal').style.display = 'none';
      document.getElementById('addEventForm').reset();
      document.getElementById('targetSelectionArea').innerHTML = '';
      document.getElementById('customEventTypeArea').style.display = 'none';
    });

    // Event type selection - show custom input for "Other"
    document.getElementById('eventType').addEventListener('change', (e) => {
      const customArea = document.getElementById('customEventTypeArea');
      const customInput = document.getElementById('customEventType');
      
      if (e.target.value === 'Other') {
        customArea.style.display = 'block';
        customInput.required = true;
      } else {
        customArea.style.display = 'none';
        customInput.required = false;
        customInput.value = '';
      }
    });

    // Event target selection
    document.getElementById('eventTarget').addEventListener('change', async (e) => {
      const area = document.getElementById('targetSelectionArea');
      const target = e.target.value;
      
      area.innerHTML = '';
      
      if (target === 'piglet') {
        await loadPiglets();
        area.innerHTML = `
          <label>Select Piglet *</label>
          <select id="selectedPiglet" required>
            <option value="">Choose piglet...</option>
            ${allPiglets.map(p => `<option value="${p.id}">${p.tagNo}</option>`).join('')}
          </select>
        `;
      } else if (target === 'litter') {
        await loadLitters();
        area.innerHTML = `
          <label>Select Litter *</label>
          <select id="selectedLitter" required>
            <option value="">Choose litter...</option>
            ${allLitters.map(l => {
              const sowName = l.pregnancy?.sow?.name || l.pregnancy?.sow?.tagNo || 'Unknown';
              const date = l.farrowDate ? new Date(l.farrowDate).toLocaleDateString() : 'N/A';
              return `<option value="${l.id}">${sowName} - ${date}</option>`;
            }).join('')}
          </select>
        `;
      } else if (target === 'multiple') {
        await loadPiglets();
        area.innerHTML = `
          <label>Select Piglets * (Hold Ctrl/Cmd to select multiple)</label>
          <select id="selectedPiglets" multiple required style="height:200px">
            ${allPiglets.map(p => `<option value="${p.id}">${p.tagNo}</option>`).join('')}
          </select>
        `;
      } else if (target === 'sow' || target === 'boar') {
        area.innerHTML = `
          <label>Tag Number *</label>
          <input type="text" id="selectedTag" placeholder="Enter ${target} tag number" required />
        `;
      }
    });

    // Form submission
    document.getElementById('addEventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      let eventType = document.getElementById('eventType').value;
      
      // Use custom type if "Other" is selected
      if (eventType === 'Other') {
        const customType = document.getElementById('customEventType').value.trim();
        if (!customType) {
          alert('Please enter a custom event type');
          return;
        }
        eventType = customType;
      }
      
      const eventData = {
        type: eventType,
        date: document.getElementById('eventDate').value,
        notes: document.getElementById('eventNotes').value || null
      };

      const target = document.getElementById('eventTarget').value;
      
      if (target === 'piglet') {
        eventData.pigletIds = [document.getElementById('selectedPiglet').value];
      } else if (target === 'litter') {
        eventData.litterId = document.getElementById('selectedLitter').value;
      } else if (target === 'multiple') {
        const select = document.getElementById('selectedPiglets');
        eventData.pigletIds = Array.from(select.selectedOptions).map(opt => opt.value);
      } else if (target === 'sow') {
        eventData.sowId = document.getElementById('selectedTag').value;
      } else if (target === 'boar') {
        eventData.boarId = document.getElementById('selectedTag').value;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/events`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(eventData)
        });

        if (response.ok) {
          alert('Event added successfully!');
          document.getElementById('addEventModal').style.display = 'none';
          document.getElementById('addEventForm').reset();
          document.getElementById('targetSelectionArea').innerHTML = '';
          document.getElementById('customEventTypeArea').style.display = 'none';
          await loadEvents();
        } else {
          const errorText = await response.text();
          console.error('Failed to add event:', response.status, errorText);
          alert('Failed to add event. The backend endpoint may not be ready yet.');
        }
      } catch (error) {
        console.error('Error adding event:', error);
        alert('Error adding event. Make sure the backend server is running.');
      }
    });

    // Filter buttons
    document.getElementById('filterUpcoming').addEventListener('click', () => {
      currentFilter = 'upcoming';
      document.querySelectorAll('#filterUpcoming, #filterPast, #filterAll').forEach(btn => btn.classList.remove('active'));
      document.getElementById('filterUpcoming').classList.add('active');
      renderEvents();
    });

    document.getElementById('filterPast').addEventListener('click', () => {
      currentFilter = 'past';
      document.querySelectorAll('#filterUpcoming, #filterPast, #filterAll').forEach(btn => btn.classList.remove('active'));
      document.getElementById('filterPast').classList.add('active');
      renderEvents();
    });

    document.getElementById('filterAll').addEventListener('click', () => {
      currentFilter = 'all';
      document.querySelectorAll('#filterUpcoming, #filterPast, #filterAll').forEach(btn => btn.classList.remove('active'));
      document.getElementById('filterAll').classList.add('active');
      renderEvents();
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadEvents();
      wireActiveNav();
      document.getElementById('year').textContent = new Date().getFullYear();
    });

    // Modal styles
    const style = document.createElement('style');
    style.textContent = `
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: white;
        padding: 24px;
        border-radius: 8px;
        max-width: 500px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-content input, .modal-content textarea, .modal-content select {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid #d1d5db;
        border-radius: 4px;
      }
      .modal-content label {
        display: block;
        font-weight: 600;
        margin-top: 12px;
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
