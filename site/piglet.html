<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pig Farm — Piglet Details</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <button class="back-btn" aria-label="Back" id="backBtn">←</button>
      <div class="brand"><span class="dot"></span> Pig Farm</div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="./">Dashboard</a>
        <a href="sows.html">Sows</a>
        <a href="boars.html">Boars</a>
        <a href="litters.html">Litters</a>
        <a href="piglets.html">Piglets</a>
        <a href="feed.html">Feed</a>
        <a href="events.html">Events</a>
        <a href="health.html">Health</a>
        <a href="reports.html">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:18px 0 60px">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
      <h2>Piglet Details</h2>
      <div style="display:flex;gap:8px">
        <button id="editBtn" class="btn">Edit</button>
        <button id="addWeightBtn" class="btn">+ Weight</button>
        <button id="addFeedBtn" class="btn">+ Feed</button>
        <button id="addEventBtn" class="btn">+ Event</button>
        <button id="deleteBtn" class="btn" style="background:#ef4444;border-color:#dc2626;color:#fff">Delete</button>
      </div>
    </div>

    <div id="pigletInfo"></div>

    <!-- Tabs -->
    <div style="display:flex;gap:8px;margin:20px 0 12px">
      <button id="tabWeight" class="btn">Weight History</button>
      <button id="tabFeed" class="btn">Feed Records</button>
      <button id="tabStatus" class="btn">Status</button>
    </div>

    <!-- Main Content (Details + Events always visible) -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div id="detailsPane"></div>
      <div id="eventsPane"></div>
    </div>
    
    <!-- Tab Content -->
    <div id="weightPane" style="display:none"></div>
    <div id="feedPane" style="display:none"></div>
    <div id="statusPane" style="display:none"></div>
  </main>

  <!-- Modal for adding weight -->
  <div id="weightModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Add Weight Record</h3>
      <form id="weightForm">
        <label>Weight (kg)</label>
        <input type="number" step="0.1" id="weightInput" required />
        <label>Date</label>
        <input type="date" id="weightDate" required />
        <label>Notes</label>
        <textarea id="weightNotes" rows="3"></textarea>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn" id="cancelWeight">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal for adding feed -->
  <div id="feedModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Add Feed Record</h3>
      <form id="feedForm">
        <label>Feed Type</label>
        <input type="text" id="feedType" required />
        <label>Quantity (kg)</label>
        <input type="number" step="0.1" id="feedQuantity" required />
        <label>Cost</label>
        <input type="number" step="0.01" id="feedCost" />
        <label>Date</label>
        <input type="date" id="feedDate" required />
        <label>Notes</label>
        <textarea id="feedNotes" rows="3"></textarea>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn" id="cancelFeed">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal for editing piglet -->
  <div id="editModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Edit Piglet</h3>
      <form id="editForm">
        <label>Tag Number</label>
        <input type="text" id="editTagNo" required />
        <label>Status</label>
        <select id="editStatus" required>
          <option value="nursing">Nursing</option>
          <option value="weaned">Weaned</option>
          <option value="grower">Grower</option>
          <option value="finisher">Finisher</option>
          <option value="ready_for_sale">Ready for Sale</option>
          <option value="sold">Sold</option>
        </select>
        <label>Health Status</label>
        <select id="editHealth" required>
          <option value="healthy">Healthy</option>
          <option value="sick">Sick</option>
          <option value="recovering">Recovering</option>
          <option value="deceased">Deceased</option>
        </select>
        <label>Notes</label>
        <textarea id="editNotes" rows="3"></textarea>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button type="submit" class="btn">Save Changes</button>
          <button type="button" class="btn" id="cancelEdit">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container small">© <span id="year"></span> Pig Farm Management</div>
  </footer>

  <script src="assets/supa-config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/api-loader.js"></script>
  <script src="assets/modules.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const API_BASE_URL = window.API_BASE_URL || 'https://pig-3k5m.onrender.com/api/v1';
    let currentPiglet = null;
    let weightRecords = [];
    let feedRecords = [];

    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadPiglet() {
      const id = getUrlParam('id');
      if (!id) {
        document.getElementById('pigletInfo').innerHTML = '<div class="card pad">Piglet ID not provided</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/piglets/${id}`);
        if (!response.ok) {
          document.getElementById('pigletInfo').innerHTML = '<div class="card pad">Piglet not found</div>';
          return;
        }

        currentPiglet = await response.json();
        weightRecords = currentPiglet.weightRecords || [];
        feedRecords = currentPiglet.feedRecords || [];
        
        renderPigletInfo();
        renderDetails();
        renderEvents();
      } catch (error) {
        console.error('Error loading piglet:', error);
        document.getElementById('pigletInfo').innerHTML = '<div class="card pad">Error loading piglet</div>';
      }
    }

    function calculateAge(farrowDate) {
      if (!farrowDate) return null;
      const birth = new Date(farrowDate);
      const now = new Date();
      const diffTime = Math.abs(now - birth);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      return diffDays;
    }

    function renderPigletInfo() {
      const farrowDate = currentPiglet.litter?.farrowDate;
      const age = calculateAge(farrowDate);
      const weeks = age !== null ? Math.floor(age/7) : null;
      const ageDisplay = weeks !== null ? `${weeks} weeks` : 'N/A';
      
      const sowName = currentPiglet.litter?.pregnancy?.sow?.name || currentPiglet.litter?.pregnancy?.sow?.tagNo || 'Unknown';
      const boarName = currentPiglet.litter?.pregnancy?.boar?.name || currentPiglet.litter?.pregnancy?.boar?.tagNo || 'Unknown';
      
      const sexColor = currentPiglet.sex === 'male' ? '#3b82f6' : '#ec4899';
      const sexIcon = currentPiglet.sex === 'male' ? '♂' : '♀';

      const info = document.getElementById('pigletInfo');
      info.innerHTML = `
        <div class="card pad" style="margin-bottom:16px">
          <div style="display:grid;grid-template-columns:100px 1fr 1fr;gap:16px">
            <div>
              <img src="/pics/Pig.jpeg" alt="Piglet" style="width:100px;height:100px;object-fit:cover;border-radius:8px" />
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <h3 style="margin:0">${currentPiglet.tagNo}</h3>
                <span style="font-size:24px;color:${sexColor}">${sexIcon}</span>
              </div>
              <div class="small">Sex</div>
              <div style="color:${sexColor};font-weight:600;text-transform:capitalize">${currentPiglet.sex}</div>
              <div style="height:8px"></div>
              <div class="small">Age</div>
              <div>${ageDisplay}</div>
              <div class="small">Birth Date</div>
              <div>${farrowDate ? new Date(farrowDate).toLocaleDateString() : 'N/A'}</div>
            </div>
            <div>
              <div class="small">Current Weight</div>
              <div style="font-size:24px;font-weight:700">${currentPiglet.currentWeight || '-'} <span style="font-size:14px">kg</span></div>
              <div style="height:8px"></div>
              <div class="small">Birth Weight</div>
              <div>${currentPiglet.birthWeight || '-'} kg</div>
              <div class="small">Status</div>
              <div>${getStatusBadge(currentPiglet.status)}</div>
              <div class="small">Health</div>
              <div>${getHealthBadge(currentPiglet.healthStatus)}</div>
            </div>
          </div>
          <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb">
            <div class="small">Mother (Sow)</div>
            <div style="font-weight:600">${sowName}</div>
            <div style="height:8px"></div>
            <div class="small">Father (Boar)</div>
            <div style="font-weight:600">${boarName}</div>
            ${currentPiglet.notes ? `
              <div style="height:8px"></div>
              <div class="small">Notes</div>
              <div>${currentPiglet.notes}</div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderDetails() {
      const pane = document.getElementById('detailsPane');
      const weightGain = currentPiglet.currentWeight && currentPiglet.birthWeight 
        ? (currentPiglet.currentWeight - currentPiglet.birthWeight).toFixed(2)
        : '-';
      
      const avgDailyGain = currentPiglet.currentWeight && currentPiglet.birthWeight && currentPiglet.litter?.farrowDate
        ? (() => {
            const age = calculateAge(currentPiglet.litter.farrowDate);
            if (age > 0) {
              return ((currentPiglet.currentWeight - currentPiglet.birthWeight) / age * 1000).toFixed(0);
            }
            return '-';
          })()
        : '-';

      // Calculate previous weight and days since last weigh
      let previousWeight = '-';
      let daysSinceWeigh = '-';
      let weightChange = '';
      let weightChangeColor = '#6b7280';
      
      if (weightRecords.length > 0) {
        // Sort by date descending
        const sorted = [...weightRecords].sort((a, b) => new Date(b.date) - new Date(a.date));
        
        // Get previous weight (second most recent)
        if (sorted.length > 1) {
          const prevWeight = sorted[1].weight;
          const currentWeight = sorted[0].weight;
          previousWeight = prevWeight + ' kg';
          
          // Calculate weight change
          const change = (currentWeight - prevWeight).toFixed(2);
          if (change > 0) {
            weightChange = `+${change} kg`;
            weightChangeColor = '#22c55e'; // green
          } else if (change < 0) {
            weightChange = `${change} kg`;
            weightChangeColor = '#ef4444'; // red
          } else {
            weightChange = 'No change';
            weightChangeColor = '#6b7280'; // gray
          }
        } else {
          previousWeight = currentPiglet.birthWeight ? currentPiglet.birthWeight + ' kg' : '-';
          if (currentPiglet.birthWeight && sorted[0].weight) {
            const change = (sorted[0].weight - currentPiglet.birthWeight).toFixed(2);
            weightChange = change > 0 ? `+${change} kg` : `${change} kg`;
            weightChangeColor = change >= 0 ? '#22c55e' : '#ef4444';
          }
        }
        
        // Days since most recent weight record
        const mostRecent = sorted[0];
        const daysSince = Math.floor((Date.now() - new Date(mostRecent.date)) / (1000 * 60 * 60 * 24));
        daysSinceWeigh = daysSince === 0 ? 'Today' : daysSince === 1 ? '1 day ago' : `${daysSince} days ago`;
      }

      pane.innerHTML = `
        <div class="card pad">
          <h3 style="margin-top:0">Growth Metrics</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
            <div>
              <div class="small">Total Weight Gain</div>
              <div style="font-size:20px;font-weight:600">${weightGain} kg</div>
            </div>
            <div>
              <div class="small">Avg Daily Gain</div>
              <div style="font-size:20px;font-weight:600">${avgDailyGain} g/day</div>
            </div>
            <div>
              <div class="small">Previous Weight</div>
              <div style="font-size:20px;font-weight:600">${previousWeight}</div>
              ${weightChange ? `<div class="small" style="color:${weightChangeColor};font-weight:600;margin-top:4px">${weightChange}</div>` : ''}
            </div>
            <div>
              <div class="small">Last Weighed</div>
              <div style="font-size:20px;font-weight:600">${daysSinceWeigh}</div>
            </div>
          </div>
          
          ${currentPiglet.maturityWeeks ? (() => {
            const setDate = currentPiglet.maturitySetDate ? new Date(currentPiglet.maturitySetDate) : new Date();
            const targetDate = new Date(setDate.getTime() + currentPiglet.maturityWeeks * 7 * 24 * 60 * 60 * 1000);
            const currentAge = calculateAge(currentPiglet.litter?.farrowDate);
            const currentWeeks = currentAge ? Math.floor(currentAge / 7) : 0;
            const progressPercent = Math.min(100, (currentWeeks / currentPiglet.maturityWeeks) * 100);
            const weeksRemaining = Math.max(0, currentPiglet.maturityWeeks - currentWeeks);
            const daysRemaining = Math.max(0, Math.ceil((targetDate - Date.now()) / (1000 * 60 * 60 * 24)));
            
            let statusColor = '#22c55e'; // green
            let statusText = 'On Track';
            if (daysRemaining <= 0) {
              statusColor = '#ef4444'; // red
              statusText = 'Maturity Reached!';
            } else if (daysRemaining <= 7) {
              statusColor = '#f59e0b'; // orange
              statusText = 'Nearing Maturity';
            }
            
            return `
              <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <h4 style="margin:0">Maturity Progress</h4>
                  <span style="background:${statusColor};color:#fff;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600">${statusText}</span>
                </div>
                <div style="margin:12px 0">
                  <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                    <span class="small">${currentWeeks} / ${currentPiglet.maturityWeeks} weeks</span>
                    <span class="small">${progressPercent.toFixed(0)}%</span>
                  </div>
                  <div style="width:100%;height:20px;background:#e5e7eb;border-radius:10px;overflow:hidden">
                    <div style="width:${progressPercent}%;height:100%;background:${statusColor};transition:width 0.3s"></div>
                  </div>
                </div>
                <div class="small" style="color:#6b7280">
                  ${daysRemaining > 0 ? `${weeksRemaining} weeks (${daysRemaining} days) remaining` : 'Ready for sale!'}
                </div>
              </div>
            `;
          })() : ''}
          
          ${currentPiglet.weaningDate ? `
            <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb">
              <div class="small">Weaning Date</div>
              <div>${new Date(currentPiglet.weaningDate).toLocaleDateString()}</div>
              ${currentPiglet.weaningWeight ? `
                <div style="height:8px"></div>
                <div class="small">Weaning Weight</div>
                <div>${currentPiglet.weaningWeight} kg</div>
              ` : ''}
            </div>
          ` : ''}
          
          ${currentPiglet.saleDate ? `
            <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb">
              <h4>Sale Information</h4>
              <div class="small">Sale Date</div>
              <div>${new Date(currentPiglet.saleDate).toLocaleDateString()}</div>
              ${currentPiglet.salePrice ? `
                <div style="height:8px"></div>
                <div class="small">Sale Price</div>
                <div style="font-size:20px;font-weight:600;color:#22c55e">$${currentPiglet.salePrice}</div>
              ` : ''}
              ${currentPiglet.buyer ? `
                <div style="height:8px"></div>
                <div class="small">Buyer</div>
                <div>${currentPiglet.buyer}</div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderEvents() {
      const pane = document.getElementById('eventsPane');
      
      // Load events from API
      const upcomingEvents = [];
      // TODO: Fetch from API when events endpoint is ready
      // const eventsResponse = await fetch(`${API_BASE_URL}/events?pigletId=${currentPiglet.id}&upcoming=true`);
      // if (eventsResponse.ok) upcomingEvents = await eventsResponse.json();
      
      let html = '<div class="card pad">';
      html += '<h3 style="margin-top:0">Upcoming Events</h3>';
      
      if (upcomingEvents.length === 0) {
        html += '<div style="color:#6b7280">No upcoming events scheduled</div>';
      } else {
        upcomingEvents.forEach(event => {
          const daysUntil = Math.ceil((event.date - Date.now()) / (1000 * 60 * 60 * 24));
          html += `
            <div style="padding:12px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;align-items:start">
                <div>
                  <div style="font-weight:600">${event.type}</div>
                  <div class="small" style="color:#6b7280">${event.description}</div>
                </div>
                <div class="small" style="text-align:right">
                  <div>${event.date.toLocaleDateString()}</div>
                  <div style="color:#22c55e;font-weight:600">In ${daysUntil} days</div>
                </div>
              </div>
            </div>
          `;
        });
      }
      
      html += '<button class="btn" style="width:100%;margin-top:12px" onclick="window.location.href=\'events.html\'">View All Events</button>';
      html += '</div>';
      pane.innerHTML = html;
    }

    function renderWeightHistory() {
      const pane = document.getElementById('weightPane');
      
      if (weightRecords.length === 0) {
        pane.innerHTML = '<div class="card pad">No weight records yet. Click "+ Weight" to add one.</div>';
        return;
      }

      const sorted = [...weightRecords].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      let html = '<div class="card pad"><h3 style="margin-top:0">Weight History</h3>';
      sorted.forEach(record => {
        html += `
          <div style="padding:12px;border-bottom:1px solid #e5e7eb">
            <div style="display:flex;justify-content:space-between">
              <div style="font-size:20px;font-weight:700">${record.weight} kg</div>
              <div class="small">${new Date(record.date).toLocaleDateString()}</div>
            </div>
            ${record.notes ? `<div class="small" style="margin-top:4px">${record.notes}</div>` : ''}
          </div>
        `;
      });
      html += '</div>';
      pane.innerHTML = html;
    }

    function renderFeedHistory() {
      const pane = document.getElementById('feedPane');
      
      if (feedRecords.length === 0) {
        pane.innerHTML = '<div class="card pad">No feed records yet. Click "+ Feed" to add one.</div>';
        return;
      }

      const sorted = [...feedRecords].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      let html = '<div class="card pad"><h3 style="margin-top:0">Feed History</h3>';
      sorted.forEach(record => {
        html += `
          <div style="padding:12px;border-bottom:1px solid #e5e7eb">
            <div style="display:flex;justify-content:space-between;align-items:start">
              <div>
                <div style="font-weight:600">${record.feedType}</div>
                <div class="small">${record.quantity} ${record.unit || 'kg'}</div>
                ${record.cost ? `<div class="small" style="color:#22c55e">$${record.cost}</div>` : ''}
              </div>
              <div class="small">${new Date(record.date).toLocaleDateString()}</div>
            </div>
            ${record.notes ? `<div class="small" style="margin-top:4px">${record.notes}</div>` : ''}
          </div>
        `;
      });
      html += '</div>';
      pane.innerHTML = html;
    }

    function renderStatusPane() {
      const pane = document.getElementById('statusPane');
      
      if (!currentPiglet) {
        pane.innerHTML = '<div class="card pad">Loading status information...</div>';
        return;
      }

      let html = '<div class="card pad"><h3 style="margin-top:0">Current Status</h3>';
      
      html += `
        <div style="padding:12px;border-bottom:1px solid #e5e7eb">
          <div style="font-weight:600">Lifecycle Stage</div>
          <div style="margin-top:4px">${getStatusBadge(currentPiglet.status)}</div>
        </div>
        
        <div style="padding:12px;border-bottom:1px solid #e5e7eb">
          <div style="font-weight:600">Health Status</div>
          <div style="margin-top:4px">${getHealthBadge(currentPiglet.health)}</div>
        </div>
        
        <div style="padding:12px;border-bottom:1px solid #e5e7eb">
          <div style="font-weight:600">Gender</div>
          <div style="margin-top:4px;text-transform:capitalize">${currentPiglet.gender || 'N/A'}</div>
        </div>
        
        <div style="padding:12px;border-bottom:1px solid #e5e7eb">
          <div style="font-weight:600">Breed</div>
          <div style="margin-top:4px">${currentPiglet.breed || 'N/A'}</div>
        </div>
        
        <div style="padding:12px">
          <div style="font-weight:600">Notes</div>
          <div style="margin-top:4px;color:#6b7280">${currentPiglet.notes || 'No notes available'}</div>
        </div>
      `;
      
      html += '</div>';
      pane.innerHTML = html;
    }

    function getStatusBadge(status) {
      const badges = {
        'nursing': '<span class="badge" style="background:#93c5fd;color:#1e40af">Nursing</span>',
        'weaned': '<span class="badge" style="background:#fde047;color:#854d0e">Weaned</span>',
        'fattening': '<span class="badge" style="background:#a78bfa;color:#5b21b6">Fattening</span>',
        'ready_for_sale': '<span class="badge" style="background:#86efac;color:#166534">Ready</span>',
        'sold': '<span class="badge" style="background:#d1d5db;color:#374151">Sold</span>',
        'deceased': '<span class="badge" style="background:#fca5a5;color:#991b1b">Deceased</span>',
      };
      return badges[status] || '<span class="badge">' + status + '</span>';
    }

    function getHealthBadge(health) {
      const badges = {
        'healthy': '<span class="badge" style="background:#86efac;color:#166534">Healthy</span>',
        'sick': '<span class="badge" style="background:#ef4444;color:#fff">Sick</span>',
        'recovering': '<span class="badge" style="background:#fde047;color:#854d0e">Recovering</span>',
        'deceased': '<span class="badge" style="background:#d1d5db;color:#374151">Deceased</span>',
      };
      return badges[health] || '<span class="badge">' + health + '</span>';
    }

    // Tab switching
    function setupTabs() {
      const tabs = {
        'tabWeight': 'weightPane',
        'tabFeed': 'feedPane',
        'tabStatus': 'statusPane'
      };

      Object.keys(tabs).forEach(tabId => {
        const tabButton = document.getElementById(tabId);
        if (!tabButton) return; // Skip if button doesn't exist
        
        tabButton.addEventListener('click', () => {
          // Hide all tab panes
          ['weightPane', 'feedPane', 'statusPane'].forEach(paneId => {
            const pane = document.getElementById(paneId);
            if (pane) pane.style.display = 'none';
          });
          
          // Remove active class from all tab buttons
          ['tabWeight', 'tabFeed', 'tabStatus'].forEach(id => {
            const btn = document.getElementById(id);
            if (btn) btn.classList.remove('active');
          });
          
          // Show selected pane and activate tab
          const selectedPane = document.getElementById(tabs[tabId]);
          if (selectedPane) selectedPane.style.display = 'block';
          tabButton.classList.add('active');
          
          // Render content based on tab
          if (tabId === 'tabWeight') renderWeightHistory();
          if (tabId === 'tabFeed') renderFeedHistory();
          if (tabId === 'tabStatus') renderStatusPane();
        });
      });
    }

    // Weight modal
    document.getElementById('addWeightBtn').addEventListener('click', () => {
      document.getElementById('weightModal').style.display = 'flex';
      document.getElementById('weightDate').valueAsDate = new Date();
    });

    document.getElementById('cancelWeight').addEventListener('click', () => {
      document.getElementById('weightModal').style.display = 'none';
      document.getElementById('weightForm').reset();
    });

    document.getElementById('weightForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const data = {
        pigletId: currentPiglet.id,
        weight: parseFloat(document.getElementById('weightInput').value),
        date: document.getElementById('weightDate').value,
        notes: document.getElementById('weightNotes').value || null
      };

      try {
        const response = await fetch(`${API_BASE_URL}/piglets/weight-records`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById('weightModal').style.display = 'none';
          document.getElementById('weightForm').reset();
          await loadPiglet(); // Reload to get updated data
          alert('Weight record added successfully!');
        } else {
          alert('Failed to add weight record');
        }
      } catch (error) {
        console.error('Error adding weight:', error);
        alert('Error adding weight record');
      }
    });

    // Feed modal
    document.getElementById('addFeedBtn').addEventListener('click', () => {
      document.getElementById('feedModal').style.display = 'flex';
      document.getElementById('feedDate').valueAsDate = new Date();
    });

    document.getElementById('cancelFeed').addEventListener('click', () => {
      document.getElementById('feedModal').style.display = 'none';
      document.getElementById('feedForm').reset();
    });

    document.getElementById('feedForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const data = {
        pigletId: currentPiglet.id,
        feedType: document.getElementById('feedType').value,
        quantity: parseFloat(document.getElementById('feedQuantity').value),
        cost: document.getElementById('feedCost').value ? parseFloat(document.getElementById('feedCost').value) : null,
        date: document.getElementById('feedDate').value,
        notes: document.getElementById('feedNotes').value || null
      };

      try {
        const response = await fetch(`${API_BASE_URL}/piglets/feed-records`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById('feedModal').style.display = 'none';
          document.getElementById('feedForm').reset();
          await loadPiglet(); // Reload to get updated data
          alert('Feed record added successfully!');
        } else {
          alert('Failed to add feed record');
        }
      } catch (error) {
        console.error('Error adding feed:', error);
        alert('Error adding feed record');
      }
    });

    // Edit button
    document.getElementById('editBtn').addEventListener('click', () => {
      if (!currentPiglet) return;
      
      // Populate form with current data
      document.getElementById('editTagNo').value = currentPiglet.tagNo || '';
      document.getElementById('editStatus').value = currentPiglet.status || 'nursing';
      document.getElementById('editHealth').value = currentPiglet.healthStatus || 'healthy';
      document.getElementById('editNotes').value = currentPiglet.notes || '';
      
      document.getElementById('editModal').style.display = 'flex';
    });

    document.getElementById('cancelEdit').addEventListener('click', () => {
      document.getElementById('editModal').style.display = 'none';
      document.getElementById('editForm').reset();
    });

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const data = {
        tagNo: document.getElementById('editTagNo').value,
        status: document.getElementById('editStatus').value,
        healthStatus: document.getElementById('editHealth').value,
        notes: document.getElementById('editNotes').value || null
      };

      try {
        const response = await fetch(`${API_BASE_URL}/piglets/${currentPiglet.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById('editModal').style.display = 'none';
          document.getElementById('editForm').reset();
          await loadPiglet(); // Reload to get updated data
          alert('Piglet updated successfully!');
        } else {
          alert('Failed to update piglet');
        }
      } catch (error) {
        console.error('Error updating piglet:', error);
        alert('Error updating piglet');
      }
    });

    // Event button - placeholder for now
    document.getElementById('addEventBtn').addEventListener('click', () => {
      alert('Event functionality coming soon! This will allow you to add health checks, vaccinations, treatments, and other events.');
    });

    // Delete button
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!currentPiglet) return;
      
      const confirmed = confirm(`Are you sure you want to delete piglet ${currentPiglet.tagNo}? This action cannot be undone.`);
      if (!confirmed) return;
      
      try {
        const response = await fetch(`${API_BASE_URL}/piglets/${currentPiglet.id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          alert('Piglet deleted successfully!');
          window.location.href = 'piglets.html';
        } else {
          alert('Failed to delete piglet');
        }
      } catch (error) {
        console.error('Error deleting piglet:', error);
        alert('Error deleting piglet');
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadPiglet();
      setupTabs();
      
      // Set Weight History tab as active by default
      const weightTab = document.getElementById('tabWeight');
      const weightPane = document.getElementById('weightPane');
      if (weightTab && weightPane) {
        weightTab.classList.add('active');
        weightPane.style.display = 'block';
      }
      
      wireActiveNav();
      document.getElementById('year').textContent = new Date().getFullYear();
    });

    // Style for modals
    const style = document.createElement('style');
    style.textContent = `
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: white;
        padding: 24px;
        border-radius: 8px;
        max-width: 500px;
        width: 90%;
      }
      .modal-content input, .modal-content textarea {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid #d1d5db;
        border-radius: 4px;
      }
      .modal-content label {
        display: block;
        font-weight: 600;
        margin-top: 12px;
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
